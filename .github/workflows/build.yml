
name: Build Byepervisor Reborn ELF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash clang-15 lld-15 \
            build-essential cmake pkg-config

      - name: Install PS5 Payload SDK
        run: |
          wget https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/v0.29/ps5-payload-dev.tar.gz
          sudo tar -xzf ps5-payload-dev.tar.gz -C /

      - name: Build ELF
        run: make
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Byepervisor-Reborn-ELF
          path: byepervisor_reborn.elf
          if-no-files-found: error
